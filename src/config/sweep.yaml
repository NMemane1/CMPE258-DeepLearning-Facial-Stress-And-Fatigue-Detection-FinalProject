# W&B Sweep configuration for hyperparameter search
# Run with:
#   wandb sweep src/config/sweep.yaml
#   wandb agent <printed_sweep_id>

program: src/training/train.py
method: bayes
metric:
  name: val/balanced_acc_mean
  goal: maximize

parameters:
  training.lr_head:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  training.lr_backbone:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.0001
  training.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.1
  model.dropout:
    distribution: uniform
    min: 0.1
    max: 0.5
  model.unfreeze_from_layer:
    values: [0, 4, 8, 12]   # 0=full unfreeze, 12=fully frozen
  augmentation.randaugment_m:
    values: [3, 6, 9, 12]
  training.loss_weights.focal:
    values: [0.0, 0.25, 0.5, 1.0]

early_terminate:
  type: hyperband
  min_iter: 3
  eta: 2

run_cap: 30
