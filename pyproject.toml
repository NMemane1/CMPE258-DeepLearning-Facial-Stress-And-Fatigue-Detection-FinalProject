[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-stress-fatigue"
version = "0.1.0"
description = "Multi-task facial stress and fatigue detection with DINOv2 + LLM explanations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NMemane1" }]
keywords = ["deep learning", "computer vision", "facial affect", "MLOps", "DINOv2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/NMemane1/CMPE258-DeepLearning-Facial-Stress-And-Fatigue-Detection-FinalProject"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks", "outputs", "runs", "wandb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
